<!DOCTYPE html>
<html><head><meta charset="UTF-8"/><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body,#root{width:100%;height:100%;overflow:hidden;background:#0b0c10;color:#e2e8f0;font-family:sans-serif}
</style></head>
<body><div id="root"></div>
<script src="react.js"></script>
<script src="react-dom.js"></script>
<script>
const {useState,createElement:m}=window.React;
const ReactDOM=window.ReactDOM;

function App(){
  const[c,setC]=useState(0);
  return m("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",flexDirection:"column",gap:20}},
    m("h1",null,"React Works!"),
    m("p",null,"Count: "+c),
    m("button",{onClick:()=>setC(c+1),style:{padding:"10px 20px",fontSize:18,background:"#22d3ee",border:"none",borderRadius:8,color:"#000",cursor:"pointer"}},"Click Me")
  )
}
ReactDOM.createRoot(document.getElementById("root")).render(m(App))
</script></body></html>
