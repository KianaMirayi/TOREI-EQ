<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport"
      content="width=device-width,initial-scale=1.0" />
    <title>TOREI-EQ</title>
    <style>
*{margin:0;padding:0;box-sizing:border-box}
html,body,#root{width:100%;height:100%;overflow:hidden;background:#0b0c10;color:#e2e8f0;font-family:sans-serif;user-select:none;-webkit-user-select:none;font-size:13px}
</style></head><body><div id="root"></div>
    <script src="react.js"></script><script src="react-dom.js"></script>
    <script>
var R=window.React,RD=window.ReactDOM,m=R.createElement;
var useState=R.useState,useEffect=R.useEffect,useRef=R.useRef;
var f2x=function(f){var mL=Math.log(20)/Math.LN10,ML=Math.log(20000)/Math.LN10;return(Math.log(Math.max(20,Math.min(20000,f)))/Math.LN10-mL)/(ML-mL)};
var g2y=function(g){return 0.5-g/60};
var x2f=function(x){return 20*Math.pow(10,x*3)};
var y2g=function(y){return(0.5-y)*60};
var SP=new Float32Array(4096);var CURVE=new Float32Array(2000);var CURVE_DIRTY=true;
var BC=["239,68,68","249,115,22","234,179,8","34,197,94","6,182,212","59,130,246","168,85,247","236,72,153"];
var FT=[20,30,50,80,100,200,300,500,800,1000,2000,3000,5000,8000,10000,20000];
var FL={20:"20",30:"30",50:"50",80:"80",100:"100",200:"200",300:"300",500:"500",800:"800",1000:"1k",2000:"2k",3000:"3k",5000:"5k",8000:"8k",10000:"10k",20000:"20k"};
var GT=[24,18,12,6,0,-6,-12,-18,-24];

function genSpectrum(){var t=Date.now()*.05;for(var i=0;i<4096;i++){var f=(i/4095)*22050;SP[i]=Math.max(-120,Math.min(0,-22-3*Math.log2(Math.max(1,f/20))+10*Math.exp(-((f-400)*(f-400))/45000)+6*Math.exp(-((f-2500)*(f-2500))/320000)+(Math.random()-.5)*3+2*Math.sin(f*.0008+t)))}}
function mockCurve(bands,W){for(var i=0;i<W;i++){var f=20*Math.pow(10,(i/(W-1))*3),tg=0;for(var j=0;j<bands.length;j++){var b=bands[j];if(!b.active||b.mute)continue;var w=Math.log(b.freq/Math.max(1,f))/Math.LN2;if(b.type==="peaking"){var bw=1.2/b.q;tg+=b.gain*Math.exp(-(w*w)/(2*bw*bw))}else if(b.type==="lowshelf")tg+=b.gain/(1+Math.exp(-w*2));else if(b.type==="highshelf")tg+=b.gain/(1+Math.exp(w*2));else if(b.type==="lowpass"){var o=2+b.slope*2;tg+=-3*o*(1-1/(1+Math.exp(w*2)))}else if(b.type==="highpass"){o=2+b.slope*2;tg+=-3*o*(1-1/(1+Math.exp(-w*2)))}}CURVE[i]=tg}CURVE_DIRTY=false}

function useStore(){
  var B,setB,sel,setSel;var _r=useState([{id:"1",type:"peaking",freq:1000,gain:0,q:1,slope:1,active:true,mute:false,solo:false}]);B=_r[0];setB=_r[1];
  _r=useState(null);sel=_r[0];setSel=_r[1];
  var update=function(id,chg){CURVE_DIRTY=true;setB(function(p){return p.map(function(b){return b.id===id?Object.assign({},b,chg):b})})};
  var add=function(f,g,t){if(B.length>=24)return;t=t||"peaking";CURVE_DIRTY=true;var b={id:String(Date.now()+Math.random()),type:t,freq:f,gain:g,q:1,slope:1,active:true,mute:false,solo:false};setB(function(p){return p.concat([b])});setSel(b.id)};
  var rem=function(id){CURVE_DIRTY=true;setB(function(p){return p.filter(function(b){return b.id!==id})});setSel(function(p){return p===id?null:p})};
  return{B:B,sel:sel,selB:B.find(function(b){return b.id===sel})||null,setSel:setSel,update:update,add:add,remove:rem};
}

var peakRef={rms:-3,peak:-3,hold:-3,frames:0};
function updatePeak(){var p=-8+Math.random()*14,m=peakRef;
  if(p>m.rms)m.rms+=(p-m.rms)*.4;else m.rms=Math.max(p,m.rms-.6);
  if(p>m.peak)m.peak+=(p-m.peak)*.8;else m.peak=Math.max(p,m.peak-.4);
  if(p>m.hold){m.hold=p;m.frames=60}else{if(m.frames>0)m.frames--;else m.hold=Math.max(p,m.hold-.2)}
}

function LevelMeter(p){var H=p.H||300;var cnv=useRef();
  useEffect(function(){if(!cnv.current||H<20)return;
  var ctx=cnv.current.getContext("2d");var dpr=window.devicePixelRatio||1;cnv.current.width=60*dpr;cnv.current.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  var rid,lt=0,cG=null,cGH=-1;
  var draw=function(ts){rid=requestAnimationFrame(draw);if(ts-lt<50)return;lt=ts-(ts-lt)%50;
  ctx.clearRect(0,0,60,H);var mw=8,mx=30,mt=0,mh=H;
  var db2n=function(db){if(db<=-90)return 0;if(db>=0)return 1;if(db>=-18)return.5+((db+18)/18)*.5;if(db>=-36)return.25+((db+36)/18)*.25;return((db+90)/54)*.25};
  var db2y=function(db){return mh*(1-db2n(db))};
  ctx.textAlign="right";ctx.textBaseline="middle";
  [0,-3,-6,-18,-36].forEach(function(db){var y=db2y(db);ctx.font='8px "JetBrains Mono"';ctx.fillStyle=db===-3?"rgba(255,255,255,.6)":"rgba(255,255,255,.35)";ctx.fillText(db.toString(),mx-3,y)});
  ctx.fillStyle="rgba(0,0,0,.3)";ctx.fillRect(mx-2,mt,mw+4,mh);ctx.strokeStyle="rgba(255,255,255,.08)";ctx.strokeRect(mx-2,mt,mw+4,mh);
  if(!cG||cGH!==H){cGH=H;cG=ctx.createLinearGradient(0,mt+mh,0,mt);cG.addColorStop(0,"#22c55e");cG.addColorStop(db2n(-18),"#22c55e");cG.addColorStop(db2n(-9),"#eab308");cG.addColorStop(db2n(-3),"#ef4444");cG.addColorStop(1,"#ef4444")}
  var m2=peakRef;
  var py=db2y(m2.peak),ph=mh-py;if(ph>0){ctx.fillStyle=cG;ctx.fillRect(mx,py,mw,ph)}
  var ry=db2y(m2.rms),rh=mh-ry;if(rh>0){ctx.fillStyle=cG;ctx.fillRect(mx+1,ry,Math.max(1,mw-2),rh)}
  var hy=db2y(m2.hold);ctx.fillStyle=m2.hold>=-.1?"#ef4444":"#fff";ctx.fillRect(mx,hy-1,mw,2);
  ctx.textAlign="center";ctx.textBaseline="bottom";ctx.font='7px "JetBrains Mono"';ctx.fillStyle=m2.hold>=-.1?"#ef4444":"rgba(255,255,255,.6)";ctx.fillText(Math.max(-90,m2.hold).toFixed(1),mx+mw/2,-2)};
  rid=requestAnimationFrame(draw);return function(){cancelAnimationFrame(rid)}},[H]);
  return m("canvas",{ref:cnv,style:{width:60,height:H,display:"block"}})
}

function EQCanvas(p){var store=p.store;var ctr=useRef(),cnv=useRef();
  var dims,setDims;var _d=useState({w:0,h:0});dims=_d[0];setDims=_d[1];
  useEffect(function(){if(!ctr.current)return;var o=new ResizeObserver(function(e){setDims({w:Math.floor(e[0].contentRect.width),h:Math.floor(e[0].contentRect.height)})});o.observe(ctr.current);return function(){o.disconnect()}},[]);
  useEffect(function(){var rid;var t=function(){rid=requestAnimationFrame(t);genSpectrum();updatePeak()};rid=requestAnimationFrame(t);return function(){cancelAnimationFrame(rid)}},[]);
  useEffect(function(){if(dims.w<80)return;
  var ctx=cnv.current.getContext("2d");var dpr=window.devicePixelRatio||1;cnv.current.width=dims.w*dpr;cnv.current.height=dims.h*dpr;ctx.scale(dpr,dpr);
  var rid;var draw=function(){rid=requestAnimationFrame(draw);
  var W=dims.w,H=dims.h,b=store.B,i;
  ctx.clearRect(0,0,W,H);
  for(i=0;i<FT.length;i++){var x=f2x(FT[i])*W;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.strokeStyle="rgba(255,255,255,.04)";ctx.stroke()}
  for(i=0;i<FT.length;i++){var mj=FT[i]===20||FT[i]===200||FT[i]===2000||FT[i]===20000,mn=FT[i]===50||FT[i]===500||FT[i]===5000;ctx.strokeStyle=mj?"rgba(255,255,255,.12)":mn?"rgba(255,255,255,.08)":"rgba(255,255,255,.04)";ctx.lineWidth=mj||mn?2:1;x=f2x(FT[i])*W;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();ctx.fillStyle=mj?"rgba(255,255,255,.6)":mn?"rgba(255,255,255,.4)":"rgba(255,255,255,.25)";ctx.font=mj?"bold 10px monospace":"9px monospace";ctx.textAlign="center";ctx.textBaseline="bottom";if(FL[FT[i]])ctx.fillText(FL[FT[i]],x,H-6)}
  for(i=0;i<GT.length;i++){var y=g2y(GT[i])*H;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.strokeStyle="rgba(255,255,255,.04)";ctx.stroke()}
  ctx.beginPath();ctx.moveTo(0,g2y(0)*H);ctx.lineTo(W,g2y(0)*H);ctx.strokeStyle="rgba(234,179,8,.5)";ctx.lineWidth=1.5;ctx.stroke();
  var PC=W;ctx.fillStyle="rgba(255,229,185,.12)";ctx.beginPath();ctx.moveTo(0,H);
  for(i=0;i<PC;i++){var f=20*Math.pow(10,(i/(PC-1))*3);var bin=Math.floor(f/22050*4095);ctx.lineTo(i,g2y(Math.max(-90,SP[Math.min(4095,bin)]))*H)}ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  ctx.strokeStyle="rgba(255,229,185,.3)";ctx.lineWidth=1.5;ctx.stroke();
  if(CURVE_DIRTY)mockCurve(b,W);
  ctx.strokeStyle="rgba(255,229,185,.9)";ctx.lineWidth=2.5;ctx.shadowColor="rgba(255,229,185,.5)";ctx.shadowBlur=12;ctx.beginPath();var ff=true;
  for(i=0;i<W;i++){var cy=g2y(CURVE[i])*H;ff?(ctx.moveTo(i,cy),ff=false):ctx.lineTo(i,cy)}ctx.stroke();ctx.shadowBlur=0;
  for(i=0;i<b.length;i++){var bn=b[i];if(!bn.active||bn.mute)continue;var nx=f2x(bn.freq)*W,ny=g2y(bn.gain)*H,isSel=bn.id===store.sel;ctx.beginPath();ctx.arc(nx,ny,isSel?9:7,0,Math.PI*2);ctx.fillStyle="rgb("+BC[i%8]+")";ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();if(isSel){ctx.beginPath();ctx.arc(nx,ny,13,0,Math.PI*2);ctx.strokeStyle="rgba(255,255,255,.4)";ctx.lineWidth=1;ctx.stroke()}}
  };rid=requestAnimationFrame(draw);return function(){cancelAnimationFrame(rid)}},[dims,store.B,store.sel]);

  var hitTest=function(mx,my){for(var i=store.B.length-1;i>=0;i--){var b=store.B[i];if(!b.active||b.mute)continue;if(Math.hypot(mx-f2x(b.freq)*dims.w,my-g2y(b.gain)*dims.h)<14)return b}return null};
  var drag=useRef(null);
  var onPD=function(e){e.stopPropagation();var r=ctr.current.getBoundingClientRect();var mx=e.clientX-r.left,my=e.clientY-r.top;var t=hitTest(mx,my);if(t){store.setSel(t.id);drag.current={id:t.id,sx:mx,sy:my,sf:t.freq,sg:t.gain,sq:t.q};e.target.setPointerCapture(e.pointerId)}};
  var onPM=function(e){var d=drag.current;if(!d)return;var r=ctr.current.getBoundingClientRect();var dx=e.clientX-r.left-d.sx,dy=e.clientY-r.top-d.sy,mul=e.ctrlKey?.1:1;if(e.altKey){var q=Math.max(.1,Math.min(40,d.sq-dy*.1*mul));store.update(d.id,{q:+q.toFixed(2)})}else{var g=Math.max(-30,Math.min(30,d.sg-dy/dims.h*60*mul));var f=Math.round(x2f(f2x(d.sf)+dx/dims.w*mul));store.update(d.id,{gain:+g.toFixed(1),freq:f})}};
  var onPU=function(){drag.current=null};
  var onWheel=function(e){var r=ctr.current.getBoundingClientRect();var mx=e.clientX-r.left,my=e.clientY-r.top;var t=hitTest(mx,my);if(t){e.preventDefault();var s=e.shiftKey?1.01:1.05;var nq=Math.max(.1,Math.min(40,t.q*(e.deltaY>0?s:1/s)));store.update(t.id,{q:+nq.toFixed(2)})}};
  var onDC=function(e){var r=ctr.current.getBoundingClientRect();var mx=e.clientX-r.left,my=e.clientY-r.top;var t=hitTest(mx,my);if(t)store.update(t.id,{gain:0});else store.add(Math.round(x2f(mx/dims.w)),+y2g(my/dims.h).toFixed(1))};
  return m("div",{className:"flex-1",style:{display:"flex",flexDirection:"row",minHeight:0,background:"#0b0c10"}},
    m("div",{ref:ctr,style:{flex:1,position:"relative",minWidth:0},onPointerDown:onPD,onPointerMove:onPM,onPointerUp:onPU,onDoubleClick:onDC,onWheel:onWheel},
      m("canvas",{ref:cnv,style:{width:"100%",height:"100%",display:"block"}})
    ),
    m("div",{style:{width:70,flex:"0 0 70px",display:"flex",alignItems:"stretch",justifyContent:"center",borderLeft:"1px solid rgba(255,255,255,.06)",background:"#0d0f14"}},
      m(LevelMeter,{H:dims.h})
    )
  );
}

function App(){
  var store=useStore();
  return m("div",{style:{width:"100%",height:"100%",display:"flex",flexDirection:"column"}},
    m("div",{style:{height:36,background:"#0d0f14",borderBottom:"1px solid rgba(255,255,255,.05)",display:"flex",alignItems:"center",padding:"0 12px",gap:8,fontSize:12}},
      m("span",{style:{color:"#eab308",fontWeight:700,letterSpacing:1}},"TOREI-EQ"),m("span",{style:{color:"#555",fontSize:10}},"v1.0-dev")
    ),
    m(EQCanvas,{store:store}),
    m("div",{style:{height:44,background:"#111318",borderTop:"1px solid rgba(255,255,255,.05)",display:"flex",alignItems:"center",padding:"0 16px",gap:12,color:"#888",fontSize:11}},
      m("span",null,"OUTPUT 0 dB"),m("div",{style:{flex:1}}),m("span",null,store.B.length+"/24")
    )
  );
}
RD.createRoot(document.getElementById("root")).render(m(App));
</script></body></html>
