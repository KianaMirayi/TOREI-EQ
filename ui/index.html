  var showTipId=tip!==null?tip:(activeId!==null?activeId:store.sel),tipB=null,tipIdx=0,i2;

    ),
    m("div",{style:{width:86,flex:"0 0 86px",display:"flex",alignItems:"stretch",justifyContent:"center",borderLeft:"1px solid rgba(255,255,255,.06)",background:"#0d0f14"}},

}

function App(){
  var store=useStore();
  var _po=useState({});var panelOffsets=_po[0],setPanelOffsets=_po[1];
  var _bo=useState(false);var bridgeOffline=_bo[0],setBridgeOffline=_bo[1];
  var setPanelOffset=function(id,x){setPanelOffsets(function(prev){var n=Object.assign({},prev);n[id]=x;return n})};
  // Delete / Backspace 删除整个选中集合（Select All 后即清空 EQ）。
  // 注意：焦点在输入框里时不能删 —— 面板里正在编辑数值时按 Backspace 会误删 band。
  useEffect(function(){var h=function(e){if(e.key!=="Delete"&&e.key!=="Backspace")return;
    var tag=e.target&&e.target.tagName;if(tag==="INPUT"||tag==="TEXTAREA")return;if(e.repeat)return;
    var ids=store.selIds.length?store.selIds:(store.sel!==null?[store.sel]:[]);if(ids.length)store.removeMany(ids)};
    window.addEventListener("keydown",h);return function(){window.removeEventListener("keydown",h)}},[store.sel,store.selIds]);
  /** Wait for the DSP bridge, then declare the initial EQ bands. If the bridge
      never becomes ready, flag the UI as offline (simulated data) so the user can
      tell that the visible curve/spectrum are NOT coming from the DSP. */
  /** Option A: declare the initial EQ bands by pushing them into the global command
      queue (window.__EQCMDS). C++ polls that queue via evaluateJavascript, so this
      does NOT depend on the fragile postMessage/emitEvent bridge. The UI_Ready
      diagnostic is dropped (it relied on the broken emitEvent direction). */
  // Mount sync. C++ owns the band state, so ASK for it rather than pushing our local
  // defaults -- pushing defaults is exactly what wiped the user's EQ whenever the
  // editor was rebuilt (switching to another plugin and back, closing/reopening the
  // window). If Band_State does not arrive within 600 ms (a C++ side that does not
  // implement Request_State yet), fall back to the old push-defaults behaviour so the
  // UI can never end up blank.
  var pushDefaultBands=function(){try{for(var i=0;i<store.B.length;i++){var b=store.B[i];sendCmd("AddBand",{index:b.id,freq:b.freq,gain:b.gain,type:b.type,q:b.q})}}catch(e){}};
  useEffect(function(){
    var done=false;
    var adopt=function(arr){
      if(done)return;done=true;
      var out=[];
      if(arr&&arr.length)for(var i=0;i<arr.length;i++){var s=arr[i]||{};if(typeof s.index!=="number")continue;
        out.push({id:s.index,type:s.type||"peaking",freq:+s.freq||1000,gain:+s.gain||0,q:+s.q||1,slope:+(s.slope||12),active:true,mute:false,solo:false,bypass:!!s.bypass,mode:s.mode||"stereo",soloDb:0})}
      out.sort(function(a,b){return a.id-b.id});

      __JUCE__.backend.addEventListener("Band_State",adopt);
      // C++ owns Output Gain too; adopt its value without echoing it back.
      __JUCE__.backend.addEventListener("Output_State",function(o){if(o&&typeof o.gain==="number")store.adoptOutputGain(+o.gain)});
    }
    sendCmd("Request_State",{});
    var t=setTimeout(function(){if(!done){done=true;pushDefaultBands()}},600);
    return function(){clearTimeout(t)}
  },[]);
  return m("div",{style:{width:"100%",height:"100%",display:"flex",flexDirection:"column"}},
    m("div",{style:{height:36,background:"#0d0f14",borderBottom:"1px solid rgba(255,255,255,.05)",display:"flex",alignItems:"center",padding:"0 12px",gap:8,fontSize:12}},
      m("span",{style:{color:"#eab308",fontWeight:700,letterSpacing:1}},"TOREI-EQ"),m("span",{style:{color:"#555",fontSize:10}},"v1.0-dev"),
      bridgeOffline?m("span",{style:{marginLeft:10,padding:"2px 8px",background:"#7f1d1d",color:"#fecaca",borderRadius:4,fontSize:10,fontWeight:700}},"⚠ DSP OFFLINE — simulated data"):m("span")
    ),
    m(EQCanvas,{store:store,panelOffsets:panelOffsets,setPanelOffset:setPanelOffset}),
    m("div",{style:{height:44,background:"#111318",borderTop:"1px solid rgba(255,255,255,.05)",display:"flex",alignItems:"center",padding:"0 16px",gap:12,color:"#888",fontSize:11}},
      m("span",null,"OUTPUT"),m(EditableValue,{value:store.outputGain,min:-24,max:24,step:.1,fmt:function(v){return(v>0?"+":"")+v.toFixed(1)+" dB"},style:{color:"#cbd5e1"},onChange:function(v){store.setOutputGain(+v.toFixed(1))}}),
      m("span",{style:{color:store.listening?"#22d3ee":"#555"}},"SOLO "+(store.selSoloDb>0?"+":"")+store.selSoloDb.toFixed(1)+" dB"),
      m("div",{style:{flex:1}}),m("span",null,store.B.length+"/24")

}
